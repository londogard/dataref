[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strand"
version = "0.1.0"
description = "Client-driven data versioning for S3 (Git-like, no servers)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "londogard" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "fsspec>=2024.2",
    "s3fs>=2024.2",
    "polars>=0.20",
]

[project.optional-dependencies]
delta = ["deltalake>=0.21"]
iceberg = ["pyiceberg>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
strand = "strand.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
